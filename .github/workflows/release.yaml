name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version specifier: explicit (e.g. 0.9.0) or keyword (patch | minor | major | prerelease)'
        required: true
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag
  id-token: write # npm provenance

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org' # writes .npmrc auth for npm publish

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs preVersionCommand (build + lint + test) as the quality gate,
      # bumps versions, regenerates CHANGELOG.md from commits, commits and tags.
      - name: Version & changelog
        run: npx nx release ${{ inputs.version }} --yes

      - name: Push commit & tag
        run: git push --follow-tags origin HEAD

      - name: Publish to npm
        run: npx nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
